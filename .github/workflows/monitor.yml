name: crypto-monitors

# 每 30 分钟运行一次所有监控。
# 说明：GitHub 免费版 schedule 为"尽力而为"触发，可能延迟/跳过。为提升可靠性：
#   - 使用 3 个错开的 cron（每 10 分钟一个触发点），避免集中在整点高负载
#   - 在运行块内用 .last_run 做 30 分钟时间门控，保证实际执行间隔约 30 分钟且不重复
on:
  schedule:
    - cron: '5,35 * * * *'
    - cron: '15,45 * * * *'
    - cron: '25,55 * * * *'
  # 支持在 Actions 页面手动触发一次（用于测试/恢复）
  workflow_dispatch:
    inputs:
      send_test_mail:
        description: '发送一封测试邮件到收件邮箱（验证云端→邮件链路）'
        type: boolean
        default: false

# 防止多个触发点并发运行导致重复监控
concurrency:
  group: crypto-monitors
  cancel-in-progress: false

jobs:
  run-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 恢复去重状态（Gate 已见公告）与 30 分钟门控时间戳
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            gate_usd1_seen.json
            .last_run
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 手动触发时勾选"发送测试邮件"→ 先发一封测试邮件验证云端→邮箱链路（不受 30 分钟门控影响）
      - name: Send test mail (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_mail == true }}
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          echo "== 发送测试邮件 =="
          python send_test_mail.py

      - name: Run all monitors (30min gate)
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          # --- 30 分钟时间门控：距上次实际执行不足 25 分钟则跳过本次 ---
          if [ -f .last_run ]; then
            last=$(cat .last_run)
            now=$(date +%s)
            diff=$(( (now - last) / 60 ))
            echo "距上次实际执行 ${diff} 分钟"
            if [ "$diff" -lt 25 ]; then
              echo "未到 30 分钟间隔，跳过本次"
              exit 0
            fi
          fi
          date +%s > .last_run
          # --- 执行监控 ---
          echo "== JustLend USDT 借款利率 =="
          python justlend_monitor.py || true
          echo "== USDD PSM (TRON) 可用量 =="
          python usdd_psm_monitor.py || true
          echo "== USDD PSM (BSC) 可用量 =="
          python usdd_psm_bsc_monitor.py || true
          echo "== Gate USD1 公告 =="
          python gate_usd1_monitor.py || true

      # 保存去重状态与门控时间戳，供下一次运行恢复
      - name: Save state
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            gate_usd1_seen.json
            .last_run
          key: monitor-state-${{ github.run_id }}
